name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pic-chat-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: PictoChat Build #${{ github.run_number }}
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/*.apk
          body: |
            ## 📸 PictoChat Debug Build #${{ github.run_number }}
            
            Auto-generated from commit **${{ github.sha }}**
            
            **Changes:**
            - ${{ join(github.event.head_commit.message['split'] || [github.event.head_commit.message]) }}
            
            **Build info:**
            - Branch: `main`
            - Triggered by: @${{ github.actor }}
            - Date: ${{ github.event.head_commit.timestamp }}
